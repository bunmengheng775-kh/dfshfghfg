<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a63">
<link rel="icon" type="image/png" href="zunologo.png">
<link rel="apple-touch-icon" href="zunologo.png">
<title>ZUNOPRO</title>
<meta name="description" content="ZUNOPRO ហាងផលិតផលឌីជីថល និង AI Subscription នៅកម្ពុជា។ ទំនាក់ទំនងដើម្បីបញ្ជាទិញ។">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Noto+Sans+Khmer:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header><div class="wrap bar">
  <a class="logo" href="#top"><img class="mark" src="zunologo.png" alt="" width="40" height="40"><span>ZUNO<span>PRO</span></span></a>
</div></header>

<main class="wrap" id="top">
  <div class="title">
    <h1>ផលិតផលទាំងអស់</h1>
    <p>ទំនាក់ទំនងយើង ដើម្បីបញ្ជាទិញ និងទទួលបានភ្លាមៗ</p>
  </div>

  <div class="filters" id="shop">
    <input class="field" id="q" type="search" placeholder="ស្វែងរកផលិតផល..." aria-label="ស្វែងរកផលិតផល">
  </div>

  <div class="grid" id="grid" aria-live="polite"></div>

</main>

<footer><div class="wrap">© ZUNOPRO · ផលិតផលឌីជីថល និង AI Subscription</div></footer>

<nav class="tabs" aria-label="ម៉ឺនុយ">
  <a href="#top" data-tab="top"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ទំព័រដើម</a>
  <a href="#shop" data-tab="shop" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>ផលិតផល</a>
  <a href="https://t.me/MengHeng_KH" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>ទំនាក់ទំនង</a>
</nav>

<script>
/* ===== កែតម្លៃទាំងនេះជាទិន្នន័យពិតរបស់អ្នក ===== */
var CONFIG = {
  telegram: "MengHeng_KH",          // Telegram username (គ្មាន @)
  phone: "០១២ ៣៤៥ ៦៧៨"          // លេខទូរស័ព្ទ
};
/* ផលិតផល៖ name, cat (ប្រភេទ), price (USD), desc, color (2 ពណ៌ gradient), mark (អក្សរលើរូប)
   តម្លៃខាងក្រោមជាគំរូ សូមកែជាតម្លៃពិត */
var PRODUCTS = [
  {name:"ChatGPT Plus ",       cat:"AI",     price:5.00,  desc:"ការជាវ AI សម្រាប់សរសេរ ស្រាវជ្រាវ និងកូដ។", c:["#10a37f","#0b5c49"], mark:"GPT", img:"chatgpt.jpeg", available:false},
  {name:"Claude Pro ",          cat:"AI",     price:6.00,  desc:"ការជាវ Claude សម្រាប់ឯកសារ និងការវិភាគ។",   c:["#d97757","#a8512f"], mark:"CL", img:"cloudai.png", available:false},
  {name:"Gemini AI Pro 18 ខែ",      cat:"AI",     price:5.80,  desc:"ការជាវ AI របស់ Google រយៈពេល ១៨ ខែ។",         c:["#4285f4","#7b4ed6"], mark:"GEM", img:"gemini.jpg", available:true},
  {name:"Gemini AI Pro 3 ខែ",      cat:"AI",     price:1.50,  desc:"ការជាវ AI របស់ Google រយៈពេល 3 ខែ។",         c:["#4285f4","#7b4ed6"], mark:"GEM", img:"gemini.jpg", available:true},
   {name:"Google AI Pro 12ខែ (ធានាពេញ 12ខែ)",      cat:"AI",     price:45.10,  desc:"ការជាវ AI របស់ Google រយៈពេល12ខែ (ធានាពេញ 12ខែ)",         c:["#4285f4","#7b4ed6"], mark:"GEM", img:"gemini12 pro.jpg", available:true},
];

var grid=document.getElementById("grid"),q=document.getElementById("q");
var tgUrl="https://t.me/"+CONFIG.telegram;
PRODUCTS.forEach(function(p,i){p.i=i});

function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function render(){
  var term=q.value.trim().toLowerCase(),list=PRODUCTS.filter(function(p){
    return !term||(p.name+" "+p.desc).toLowerCase().indexOf(term)>=0});
  list.sort(function(a,b){return b.i-a.i});
  if(!list.length){grid.innerHTML='<div class="empty">រកមិនឃើញផលិតផលទេ។ សូមសាកល្បងពាក្យផ្សេង ឬទំនាក់ទំនងយើង។</div>';return}
  grid.innerHTML=list.map(function(p){
    var action=p.available ? '<a class="btn block" href="'+tgUrl+'" target="_blank" rel="noopener">ទំនាក់ទំនង</a>' : '<div class="availability">មិនទាន់មានលក់</div>';
    return '<article class="card"><div class="thumb">'+
      '<span class="cat">'+esc(p.cat)+'</span><img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy"></div>'+
      '<div class="info"><h3>'+esc(p.name)+'</h3><div class="price">'+(p.available ? '$'+p.price.toFixed(2) : '')+'</div>'+action+'</div></article>';
  }).join("");
}
q.addEventListener("input",render);
render();

document.getElementById("tgMain").href=tgUrl;
document.getElementById("tgText").textContent="@"+CONFIG.telegram;
document.getElementById("phoneText").textContent=CONFIG.phone;
document.querySelectorAll(".copy").forEach(function(b){
  b.addEventListener("click",function(){
    var el=document.getElementById(b.dataset.copy),t=el.textContent;
    function sel(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r)}
    try{navigator.clipboard.writeText(t).then(function(){b.textContent="បានចម្លង"},sel)}catch(e){sel()}
    setTimeout(function(){b.textContent="ចម្លង"},1500);
  });
});

/* highlight bottom tab */
var tabs=document.querySelectorAll("nav.tabs a");
function setTab(id){tabs.forEach(function(a){a.classList.toggle("on",a.dataset.tab===id)})}
tabs.forEach(function(a){a.addEventListener("click",function(){setTab(a.dataset.tab)})});
</script>
</body>
</html>
